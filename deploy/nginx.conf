# 内容港 Harbor — Web 容器入口（nginx 直接服务 SPA，/api 反代后端）
#
# 说明：本文件被 Dockerfile.web 复制为 /etc/nginx/conf.d/default.conf，
# 由主配置的 http{} 上下文 include —— limit_req_zone 必须写在这里（http 级），
# 不能放进 server{} 里（放进去会 [emerg] directive is not allowed here，容器起不来）。

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Vue 构建产物（Dockerfile.web COPY dist 到此处）
    root /usr/share/nginx/html;
    index index.html;

    # 安全头设置
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    server_tokens off;
    client_max_body_size 10M;

    # REST API / SSE 反向代理（Docker Compose 网络内用服务名 backend）
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（任务进度实时流）必须关闭缓冲，否则事件被攒着不下发
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    # 健康检查透传（compose healthcheck 用）
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA 路由：命中文件直接给，其余回落 index.html（history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 防止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
