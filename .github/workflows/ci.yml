name: CI

on:
  push:
    branches: [main, refactor-v1]
  pull_request:
    branches: [main, refactor-v1]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: backed/pnpm-lock.yaml
      - name: 安装 uv
        run: pip install uv
      - name: 安装依赖（uv sync，含 dev 组）
        run: uv sync
      # 与本地 scripts/check_all.sh 四道门禁保持一致：
      # 少任何一道，就等于把本可以在 CI 拦住的回归放到线上。
      - name: 语法检查（compileall）
        run: uv run python -m compileall -q .
      - name: 静态门禁（ruff：未定义名 / 运行时错误）
        run: uv run ruff check .
      - name: 依赖安全扫描（pip-audit）
        continue-on-error: true
        run: |
          uv run pip install pip-audit
          uv run pip-audit --strict || true
      - name: 单元测试（pytest）
        run: uv run pytest -q --no-header
      - name: 启动冒烟测试（应用可装配、API 可访问）
        run: uv run python -c "from app.factory import create_app; assert create_app(); print('app assembled ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: 安装依赖
        run: pnpm install
      - name: 构建（vite build，产物须能在 FastAPI /static 下挂载）
        run: pnpm build
