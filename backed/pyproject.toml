# 内容港 Harbor — AI 多平台内容发布中台
# 包管理与启动推荐使用 uv（https://github.com/astral-sh/uv）

[project]
name = "ai-content-hub-backend"
version = "0.6.0"
description = "AI 内容中台后端：基于 FastAPI 的文章库 / 多平台发布 / AIGC 合规门禁"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "click>=8.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    # 平台发布引擎依赖
    "patchright>=1.60",
    "requests>=2.31",
    "markdown>=3.5",
    "mcp>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.uv]
# 应用型脚手架（非可发布库）：不打包安装项目本身，用 uv run 在环境中执行
package = false
# 默认同步时安装 dev 依赖组，便于测试
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
