# 内容港 Harbor — AI 多平台内容发布中台
# 包管理与启动推荐使用 uv（https://github.com/astral-sh/uv）

[project]
name = "ai-content-hub-backend"
version = "0.6.3"
description = "AI 内容中台后端：基于 FastAPI 的文章库 / 多平台发布 / AIGC 合规门禁"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "click>=8.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    # 平台发布引擎依赖
    "patchright>=1.60",
    "requests>=2.31",
    "markdown>=3.5",
    "mcp>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.uv]
# 应用型脚手架（非可发布库）：不打包安装项目本身，用 uv run 在环境中执行
package = false
# 默认同步时安装 dev 依赖组，便于测试
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Pydantic 弃用一律当错误：`.dict()` 在 v2 已弃用、v3 移除，而依赖写的是
# `pydantic>=2.0.0`（允许装 v3）。让它在测试里红掉，比等升级炸在运行时强。
filterwarnings = [
    "error::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
# 回归门禁只查"真会出错"的规则：
#   F82 未定义名 / 未绑定名   —— scheduler.py 的 row F821 就是这么漏上线的
#   F7  assert/return/Continue 位置错、except 位置错等运行时错误
#   E9  语法错误
# 风格与卫生类（F401 死 import 23 处、E402 导入位置 9 处、F841 死变量…）
# 属于存量技术债，全开会产出 58 条噪音，没人看输出等于没门禁，故暂不纳入。
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F7", "F82"]
